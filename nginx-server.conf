# ============================================================
# owlsgo v3 — Nginx 站点完整配置（随程序走，不依赖 phpstudy 面板）
# ============================================================
# ★ 为什么有这个文件：
#   phpstudy 面板每次修改站点/切换 PHP 版本都会整文件重写 conf/vhosts/*.conf，
#   且重写时曾出现「含空格路径丢失英文双引号」的缺陷（ssl_certificate 等指令
#   解析失败 → 整个 Nginx 起不来 → 全站 502）。本文件由 nginx.conf 直接 include，
#   面板怎么重写 vhost 都不影响本配置。
#
# ★ 接入方式（已在 nginx.conf 里完成，一次性）：
#   http 块中注释掉  include vhosts/*.conf;
#   改为            include "D:/Program Files (x86)/phpstudy_pro/WWW/v3/nginx-server.conf";
#
# ★ 切换 PHP 版本时：
#   若面板更换 PHP 后出现 502，把下方 fastcgi_pass 端口改成实际 php-cgi 监听端口即可。
#   本机当前：9001（phpstudy 站点所选 PHP 8.2.9 的 php-cgi 池）。
#   参考 phpstudy 常见映射：9000→php7.3 | 9001→php8.0.2 | 9002→php8.2.9（以本机实际监听为准）。
#
# ★ 仓库同步：本文件随 v3 仓库走（源码在 v3/nginx-server.conf），
#   改动后运行 bash "D:/Project files/owlsgo/v3/.tools/sync-www.sh" 同步到运行副本。
# ============================================================

server {
    listen        80;
    listen        443 ssl;
    server_name   localhost;

    ssl_certificate      "D:/Program Files (x86)/phpstudy_pro/Extensions/Nginx1.16.1/conf/ssl/localhost.pem";
    ssl_certificate_key  "D:/Program Files (x86)/phpstudy_pro/Extensions/Nginx1.16.1/conf/ssl/localhost.key";
    ssl_session_timeout  5m;
    ssl_protocols        TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root   "D:/Program Files (x86)/phpstudy_pro/WWW/v3";

    # ★ 目录保护（Nginx 侧兜底，与程序内 .htaccess 双保险）：
    #   data/ 有数据库配置与 SQLite 库；core/optional/plugins 是程序代码；
    #   upload/、avatars/ 允许静态访问但禁 PHP 执行（纵深防御）。
    location ~ ^/app/(data|core|optional|plugins)/ {
        deny all;
        return 403;
    }
    location ~* ^/app/(upload|avatars)/.*\.php$ {
        deny all;
        return 403;
    }

    # 静态资源缓存 7 天
    location ~* \.(css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        index index.php index.html;
        # v3 伪静态：/forum/1、/thread/12 等路径段回填为 a= 参数（程序内 parse_path_route 解析）
        try_files $uri $uri/ /index.php?$query_string;
        autoindex off;
    }

    location ~ \.php(.*)$ {
        fastcgi_pass   127.0.0.1:9001;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;
    }

    # 禁止隐藏文件（.git 等）
    location ~ /\. {
        deny all;
    }
}
